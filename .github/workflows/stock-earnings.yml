name: Stock Earnings

on:
    workflow_dispatch:
    # schedule:
        # - cron: '30 16 1,28-31 * *' # First day and possible last days; actual last-day check is below

jobs:
    run-stock-earnings:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install requests supabase psycopg2-binary

            - name: Run stock earnings script
              env:
                FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
              run: |
                if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
                  || [ "$(date -u +%d)" = "01" ] \
                  || [ "$(date -u -d tomorrow +%d)" = "01" ]; then
                  python -m automation.stock_earnings
                else
                  echo "Skipping: today is neither the first nor last day of the month."
                fi