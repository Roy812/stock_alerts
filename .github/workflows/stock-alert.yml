name: Stock Alert

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1-6' # Monday to Saturday at 18pm UTC (20pm Amsterdam time)

jobs:
    run-stock-alert:
        runs-on: ubuntu-latest
        # env:
        #   TZ: 'Amsterdam/Europe'
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install requests websocket-client

            - name: Run stock alert script
              run: |
                python python-ntfy/ntfy.py