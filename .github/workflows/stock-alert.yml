name: Stock Alert

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5' # Monday through Friday at 6:00 AM UTC

jobs:
    run-stock-alert:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install requests websocket-client finnhub

            - name: Run stock alert script
              run: |
                python ntfy/ntfy.py