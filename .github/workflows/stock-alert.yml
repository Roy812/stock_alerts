name: Stock Alert

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1-5' # Monday through Friday at 7:00 AM UTC
    - cron: '0 17 * * 1-5' # Monday through Friday at 17:00 AM UTC

jobs:
    run-stock-alert:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install requests websocket-client finnhub-python certifi

            - name: Run stock alert script
              env:
                TEST_SECRET: ${{ secrets.TEST_SECRET }}
                # ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
                # ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
              run: |
                python ntfy/ntfy.py