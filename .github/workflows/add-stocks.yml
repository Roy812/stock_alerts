name: Add Stocks

on:
    workflow_dispatch:

jobs:
    run-stock-alert:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install requests supabase psycopg2-binary finnhub-python

            - name: Run add stocks script
              env:
                FINNHUB_API: ${{ secrets.FINNHUB_API }}
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                ADD_STOCKS_SECRET: ${{ secrets.ADD_STOCKS_SECRET }}
                CATEGORY_SECRET: ${{ secrets.CATEGORY_SECRET }}
              run: |
                python python -m automation.add_stocks
