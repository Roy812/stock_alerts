name: Stock Price History

on:
    workflow_dispatch:
    schedule:
        - cron: '0 17 * * 1-5' # Monday through Friday at 17:00 AM UTC

jobs:
    run-stock-alert:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                python -m pip install requests supabase

            - name: Run stock price history script
              env:
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
                ALPHA_VANTAGE_API: ${{ secrets.ALPHA_VANTAGE_API }}
              run: |
                python -m automation.stock_price_history
